<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
<script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
<title>Skills Test</title>
    
 <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            max-width: 480px;
            margin: 40px auto;
            background: #f6f0e7;
            color: #2b2b2b;
        }
        h1 {
            font-size: 1.4rem;
            text-align: center;
            margin-bottom: 4px;
        }
        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 24px;
            font-size: 0.9rem;
        }
        .menu {
            background: #e5dcd0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .menu-item:last-child { border-bottom: none; }
        .menu-item label {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .price { color: #666; font-size: 0.9rem; }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background: #665a4e;
            color: #fff;
            font-size: 1rem;
        }
        #order {
            margin-top: 20px;
            background: #e5dcd0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }
  
    </style>
</head>
<body>

    <h1>Minimalyst Coffee House</h1>
    <p class="subtitle">Premium coffee, made simple.</p>

    <div class="menu">
        <div class="menu-item">
            <label><input type="checkbox" id="dr1" value="100"> Mocha</label>
            <span class="price">₱100.00</span>
        </div>
        <div class="menu-item">
            <label><input type="checkbox" id="dr2" value="75"> Americano</label>
            <span class="price">₱75.00</span>
        </div>
        <div class="menu-item">
            <label><input type="checkbox" id="dr3" value="100"> Spanish Latte</label>
            <span class="price">₱100.00</span>
        </div>
        <div class="menu-item">
            <label><input type="checkbox" id="dr4" value="90"> Caffe Latte</label>
            <span class="price">₱90.00</span>
        </div>
        <div class="menu-item">
            <label><input type="checkbox" id="dr5" value="110"> Macchiato</label>
            <span class="price">₱110.00</span>
        </div>
    </div>

    <button id="generatebutton" py-click="create_order">Generate Receipt</button>

    <div id="order">
        <p class="empty">Your receipt will appear here.</p>
    </div>

<script type="py">
from pyscript import document

def create_order(event):

    order = document.getElementById("order")
    order.innerHTML = ""

    dr1 = document.getElementById("dr1")
    dr2 = document.getElementById("dr2")
    dr3 = document.getElementById("dr3")
    dr4 = document.getElementById("dr4")
    dr5 = document.getElementById("dr5")

    pr1 = float(dr1.value) * dr1.checked
    pr2 = float(dr2.value) * dr2.checked
    pr3 = float(dr3.value) * dr3.checked
    pr4 = float(dr4.value) * dr4.checked
    pr5 = float(dr5.value) * dr5.checked

    li1 = ("Mocha - ₱" + str(pr1) + "<br>") * dr1.checked
    li2 = ("Americano - ₱" + str(pr2) + "<br>") * dr2.checked
    li3 = ("Spanish Latte - ₱" + str(pr3) + "<br>") * dr3.checked
    li4 = ("Caffe Latte - ₱" + str(pr4) + "<br>") * dr4.checked
    li5 = ("Macchiato - ₱" + str(pr5) + "<br>") * dr5.checked

    subtotal = round(pr1 + pr2 + pr3 + pr4 + pr5, 2)
    vat = round(subtotal * 0.12, 2)
    final_cost = round(subtotal + vat, 2)

    order.innerHTML = (
        li1 + li2 + li3 + li4 + li5
        + "<br>Subtotal: ₱" + str(subtotal)
        + "<br>VAT: ₱" + str(vat)
        + "<br>Total: ₱" + str(final_cost)
    )
</script>

</body>
</html>
